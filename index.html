<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي قياس الذكاء</title>
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #0EA5E9;
            --accent: #8B5CF6;
            --bg: #F8FAFC;
            --text: #1E293B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #quiz-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        .illustration {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        h1 { color: var(--primary); margin-bottom: 0.5rem; }
        p { color: #64748B; margin-bottom: 2rem; }

        input[type="number"] {
            padding: 0.8rem;
            width: 80%;
            border: 2px solid #E2E8F0;
            border-radius: 0.5rem;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.05); }

        #intro-step { display: none; }
        .question-step { display: none; }
        
        .active { display: block !important; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            padding: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        #result-container { display: none; }
        .iq-score {
            font-size: 4rem;
            font-weight: bold;
            color: var(--secondary);
            margin: 1rem 0;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <!-- المقدمة -->
    <div id="intro-step" class="active">
        <span class="illustration">🤖</span>
        <h1>مُحاكي الذكاء الاصطناعي</h1>
        <p>اختبار منطقي مبسط مستوحى من مقاييس الـ IQ العالمية.</p>
        <input type="number" id="age" placeholder="أدخل عمرك (بالسنوات)" min="10" max="99">
        <br>
        <button onclick="startQuiz()">ابدأ الاختبار</button>
    </div>

    <!-- الأسئلة -->
    <div id="question-step" class="question-step">
        <span class="illustration" id="q-icon">❓</span>
        <h2 id="q-text">السؤال</h2>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- النتيجة -->
    <div id="result-container">
        <span class="illustration">🎉</span>
        <h2>نتيج
