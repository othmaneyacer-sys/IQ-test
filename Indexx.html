<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكات قياس الذكاء</title>
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #0EA5E9;
            --accent: #8B5CF6;
            --bg: #F8FAFC;
            --text: #1E293B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #quiz-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        .illustration {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        h1 { color: var(--primary); margin-bottom: 0.5rem; }
        p { color: #64748B; margin-bottom: 2rem; }

        input[type="number"] {
            padding: 0.8rem;
            width: 80%;
            border: 2px solid #E2E8F0;
            border-radius: 0.5rem;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.05); }

        .question-step { display: none; }
        .active { display: block; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            padding: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        #result-container { display: none; }
        .iq-score {
            font-size: 4rem;
            font-weight: bold;
            color: var(--secondary);
            margin: 1rem 0;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <!-- المقدمة -->
    <div id="intro-step" class="active">
        <span class="illustration">🤖</span>
        <h1>مُحاكي الذكاء الاصطناعي</h1>
        <p>اختبار منطقي مبسط مستوحى من مقاييس الـ IQ العالمية.</p>
        <input type="number" id="age" placeholder="أدخل عمرك (بالسنوات)" min="10" max="99">
        <br>
        <button onclick="startQuiz()">ابدأ الاختبار</button>
    </div>

    <!-- الأسئلة -->
    <div id="question-step" class="question-step">
        <span class="illustration" id="q-icon">❓</span>
        <h2 id="q-text">السؤال</h2>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- النتيجة -->
    <div id="result-container">
        <span class="illustration">🎉</span>
        <h2>نتيجتك التقديرية</h2>
        <div class="iq-score" id="iq-score">0</div>
        <p>تذكر: هذا مجرد اختبار محاكاة ترفيهي ولا يعبر بدقة عن قدراتك الذهنية الحقيقية.</p>
        <button onclick="location.reload()">إعادة التجربة</button>
    </div>
</div>

<script>
    const questions = [
        { q: "ما هو الرقم المفقود في السلسلة: 2، 4، 8، 16، ...؟", options: ["24", "32", "64", "20"], answer: "32", icon: "🔢" },
        { q: "أي الأشكال التالية لا ينتمي للمجموعة: (مربع، مستطيل، دائرة، متوازي أضلاع)؟", options: ["مربع", "دائرة", "مستطيل", "جميعها تنتمي"], answer: "دائرة", icon: "⭕" },
        { q: "عكس كلمة 'شجاع' هو...", option: ["قوي", "جبان", "ذكي", "سريع"], answer: "جبان", icon: "🦁" },
        { q: "إذا كانت الساعة 3:15، فكم تكون الزاوية الحادة بين العقربين؟", options: ["0°", "7.5°", "15°", "30°"], answer: "7.5°", icon: "⏰" },
        { q: "ترتيب الحروف 'ت ب ك ا ر' يشكل كلمة تعني...", options: ["دولة", "حيوان", "أداة", "نبات"], answer: "حيوان", icon: "🔤" }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAge = 0;

    function startQuiz() {
        const ageInput = document.getElementById("age").value;
        if (!ageInput || ageInput < 10 || ageInput > 99) {
            alert("يرجى إدخال عمر صحيح.");
            return;
        }
        userAge = parseInt(ageInput);
        document.getElementById("intro-step").classList.remove("active");
        document.getElementById("question-step").classList.add("active");
        showQuestion();
    }

    function showQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById("q-icon").innerText = qData.icon;
        document.getElementById("q-text").innerText = qData.q;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        qData.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedOption) {
        if (selectedOption === questions[currentQuestion].answer) {
            score++;
        }
        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("question-step").classList.remove("active");
        // معادلة تقديرية بسيطة تعتمد على العمر ونسبة الإجابات الصحيحة
        const baseIQs = [85, 95, 105, 115, 125, 135];
        const calculatedIQ = baseIQs[score] + Math.floor((userAge - 25) / 5); 
        
        document.getElementById("iq-score").innerText = calculatedIQ;
        document.getElementById("result-container").style.display = "block";
    }
</script>

</body>
</html>
